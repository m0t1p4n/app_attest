group 'com.motsipan'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// The Kotlin Gradle Plugin is intentionally not applied here: Flutter applies it
// for AGP 8.x, and AGP 9+ compiles Kotlin with Built-in Kotlin.
// See https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
apply plugin: 'com.android.library'

android {
    namespace 'com.motsipan'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'com.google.android.play:integrity:1.4.0'
}
